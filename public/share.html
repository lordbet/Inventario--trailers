<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inspección</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>Inspección de Trailer</h1></header><main><div id="x">Cargando...</div></main><script>
const id=location.pathname.split("/").pop();fetch("/api/inspections/"+id).then(r=>r.json()).then(x=>{document.title="Inspección "+x.trailer;document.getElementById("x").innerHTML=`<article class="card" style="display:block;cursor:default"><h2>${x.trailer} <span class="badge ${x.status==="50/50"?"c50":x.status}">${x.status}</span></h2><p><b>Sello:</b> ${x.seal||"Sin sello"}</p><p><b>Condición:</b> ${x.emptyBox?"Caja vacía":"Caja con contenido"}</p><p><b>Observaciones:</b> ${x.tags.join(", ")||"Ninguna"}</p><p><b>Comentarios:</b><br>${x.comments||"Sin comentarios"}</p><p><b>Inspector:</b> ${x.inspector||"No indicado"}</p><div class="photos">${x.photos.map(p=>`<img src="${p}">`).join("")}</div><p><small>Fecha: ${new Date(x.created).toLocaleString("es-MX")}</small></p></article>`}).catch(()=>document.getElementById("x").textContent="Inspección no encontrada");
</script></body></html>
