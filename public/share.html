<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inspección</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>Inspección de Trailer</h1></header><main><div id="x">Cargando...</div></main><script>
const id=location.pathname.split('/').pop(),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function since(s){if(!s)return null;let a=new Date(s+'T00:00:00'),b=new Date();return Math.max(0,Math.floor((b-a)/86400000))}function days(x){if(!x.entryDate)return 0;let a=new Date(x.entryDate+'T00:00:00'),b=x.inPatio!==false?new Date():new Date((x.exitDate||x.entryDate)+'T00:00:00');return Math.max(0,Math.floor((b-a)/86400000))}function date(s){return s?new Date(s+'T00:00:00').toLocaleDateString('es-MX'):'No indicada'}
fetch('/api/inspections/'+id).then(r=>r.json()).then(x=>{document.title='Inspección '+x.trailer;document.getElementById('x').innerHTML=`<article class="card" style="display:block;cursor:default"><h2>${esc(x.trailer)} <span class="badge ${x.status==='50/50'?'c50':x.status}">${esc(x.status)}</span></h2><p><b>Situación:</b> ${x.inPatio!==false?'Actualmente en patio':'Ya no está en patio'}</p><p><b>Tipo:</b> ${x.emptyBox?'Caja vacía':'Caja cargada'}</p><p><b>Sello:</b> ${esc(x.seal||'Sin sello')}</p><p><b>Cliente:</b> ${esc(x.client||'No indicado')}</p><p><b>Modelo:</b> ${esc(x.model||'No indicado')}</p><p><b>Patio:</b> ${esc(x.yard||'No indicado')}</p><p><b>Geocerca:</b> ${esc(x.geofence||'No indicada')}</p><p><b>En taller:</b> ${x.workshop?'Sí':'No'}</p><p><b>Estatus:</b> ${esc(x.operationalStatus||'No indicado')}</p><p><b>Última Carta Porte:</b> ${esc(x.lastWaybill||'0')}</p><p><b>Fecha último viaje:</b> ${date(x.lastTripDate)}</p><p><b>Días sin movimiento:</b> ${since(x.lastTripDate)??'No calculable'}</p><p><b>Ingreso:</b> ${date(x.entryDate)}</p><p><b>Días:</b> ${days(x)}</p>${x.exitDate?`<p><b>Salida:</b> ${date(x.exitDate)}</p>`:''}<p><b>Condición para viaje:</b> ${esc(x.travelCondition||'No indicada')}</p><p><b>Observaciones:</b> ${esc((x.tags||[]).join(', ')||'Ninguna')}</p><p><b>Comentarios:</b><br>${esc(x.comments||'Sin comentarios')}</p><p><b>Inspector:</b> ${esc(x.inspector||'No indicado')}</p><div class="photos">${(x.photos||[]).map(p=>`<img src="${p}">`).join('')}</div></article>`}).catch(()=>document.getElementById('x').textContent='Inspección no encontrada');
</script></body></html>
