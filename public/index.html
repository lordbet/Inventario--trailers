<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventario de Trailers</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><h1>Inventario de Trailers</h1><small>Inspección y evidencia fotográfica</small></div><button onclick="newInspection()">+ Nueva inspección</button></header>
<main><section id="home"><div class="stats"><b><span id="n">0</span><small>Total</small></b><b><span id="g">0</span><small>Decentes</small></b><b><span id="m">0</span><small>50/50</small></b><b><span id="d">0</span><small>Dañadas</small></b></div>
<div class="bar"><input id="q" placeholder="Buscar trailer o sello" oninput="render()"><select id="f" onchange="render()"><option value="">Todos</option><option>Decente</option><option>50/50</option><option>Dañada</option></select><a href="/api/report.csv">CSV</a><a href="/api/report.json">JSON</a></div><div id="list"></div></section>
<section id="form" class="hide"><button class="back" onclick="home()">← Regresar</button><h2>Nueva inspección</h2><form id="frm"><label>Trailer/caja<input name="trailer" required placeholder="TR-1026"></label><label>Sello<input name="seal" placeholder="125478"></label><label class="check"><input type="checkbox" name="emptyBox"> La caja está vacía</label><h3>Estado</h3><div class="states"><label><input type="radio" name="status" value="Decente" required>🟢 Decente</label><label><input type="radio" name="status" value="50/50">🟡 50/50</label><label><input type="radio" name="status" value="Dañada">🔴 Dañada</label></div><h3>Observaciones</h3><div class="tags">${["Le falta algo","Golpes","Suciedad","Daño en piso","Daño en paredes","Daño en puertas","Otro"].map(x=>`<label><input type="checkbox" name="tag" value="${x}">${x}</label>`).join("")}</div><textarea name="comments" placeholder="Comentarios y detalles"></textarea><label>Fotos (puedes seleccionar varias)<input type="file" name="photos" accept="image/*" capture="environment" multiple></label><label>Inspector<input name="inspector" placeholder="Nombre"></label><button>Guardar inspección</button></form></section><section id="detail" class="hide"></section></main><script src="app.js"></script></body></html>
